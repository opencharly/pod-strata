# opencharly/pod-strata — the Strata POD: the engine served from the CDI pod contract.
#
# Two things live here, and the split is the cutover's whole point (opencharly/opencharly#1174):
#
#   box/strata/charly.yml   the `strata` IMAGE — `base: pod-cdi.pod-cdi`, composing
#                           opencharly/layer-strata's engine candy. The POD, and the box skill.
#   this file               the `check-strata-gpu-pod` disposable bed — the family's ONLY
#                           witness — and the `defaults:`/`import:`/`discover:` the box needs.
#
# The engine itself (the bake, the artifact pins, the env surface) stays in
# opencharly/layer-strata; this repo composes it and proves it. The rule is `AGENTS.md`'s.
repo: github.com/opencharly/pod-strata
defaults:
    # `tag` + `registry` only, and only here: a TOP-LEVEL `registry:` is rejected by the schema.
    #
    # Without the registry the BUILD tags the image `localhost/strata:<check-tag>` while the pod
    # deploy resolves `ghcr.io/opencharly/strata:<check-tag>`, so the deploy cannot see the freshly
    # built image and tries to pull it instead. Measured on the family's bed run before the split:
    # image-build PASS, check-image PASS, deploy-add PASS, then
    # `charly config: unable to copy from source docker://ghcr.io/opencharly/strata:check-strata-gpu-pod-…`.
    # Invisible to `box validate`, to `box generate`, to the build and to every image check: only the
    # deploy compares the built identity with the deployed one.
    #
    # `platform:` and `build:` are NOT here — each is declared on the box that needs it. A default is
    # a value for every image in the repo; this repo has one image and it states its own contract,
    # exactly as the base (pod-cdi) does.
    tag: auto
    registry: ghcr.io/opencharly
import:
    # The POD contract, as a namespace, so the box can say `base: pod-cdi.pod-cdi`.
    #
    # HERE, at the PROJECT root — not in `box/strata/charly.yml` beside the `base:` that uses it.
    # That placement reads better (the box would be self-contained) and it is what an earlier draft
    # of this repo did. It does not work, and `charly box validate` does not say so. Measured
    # 2026-11-19 on this tree with the SAME import moved into the discovered box file and nothing
    # else changed:
    #   $ charly box validate
    #   charly box validate: OK — checked 12 candies, 1 box, 1 deploy, 6 distros, 7 builders;
    #   0 warnings, 0 errors                       # 12 candies / 1 box, against 136 / 13 at the root
    #   $ charly box generate
    #   charly: error: command "generate": rendering Containerfiles: generating Containerfile for
    #   strata: candy github.com/opencharly/layer-build-toolchain: resolved 12 package(s) [autoconf
    #   automake binutils bison ccache cmake flex gdb git libtool nasm patch] but box strata has no
    #   distro definition to install them with      # rc=1
    # A namespace mounted by a discovered document is visible to that document's own lookups and
    # NOT to the project's entity set, so the base's `distro:`/`build:` chain never arrives — and
    # `validate` still passes because every entity it loaded is individually consistent. The
    # generate step is the instrument that catches it; run BOTH after any manifest edit.
    #
    # A MERGED TAG, never a branch or a SHA: an `@github` ref does not resolve for anything else
    # (opencharly/charly#1201), and only a merged ref is a pin (AGENTS.md Part II #3). This is
    # `pod-cdi`'s newest release, measured 2026-11-19 —
    #   $ git -C pod-cdi for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -1
    #   v2026.323.1302
    #   $ git -C pod-cdi merge-base --is-ancestor v2026.323.1302 origin/main; echo $?
    #   0
    # — and it composes `layer-cdi:v2026.323.0302`, which requires `layer-cuda:v2026.323.0252` and
    # nothing from `layer-nvidia`. The whole chain, command by command: `PIN-CHAIN.md`.
    # The pin must also stay new enough that the imported namespace LOADS under the charly
    # binary the umbrella pins: pod-cdi v2026.324.1644 resolves distro-arch v2026.324.0908
    # (the release carrying distro-arch#74, which nests `check-arch-vm`'s members inside the
    # bed's venue). At v2026.323.1302 the umbrella fails to load at all
    # (opencharly/pod-kde-vnc#3, same mechanism).
    - pod-cdi: '@github.com/opencharly/pod-cdi:v2026.324.1644'
discover:
    - path: box
      recursive: true

# check-strata-gpu-pod — the family's REAL-engine witness, and its ONLY bed.
#
# MOVED, not rewritten: this block is the text of the bed that lives in opencharly/layer-strata's
# root manifest at the head of its v0.2.16 PR (`opencharly/layer-strata#24`, head
# `180be5a9fbe9d6c3d5062b8a82e4551cd583098f`), which is the revision its GPU gate passed on. Ported
# 1:1 — the ONE difference the base change makes is which repo the `image: strata` name resolves in,
# so every assertion, timeout, `eventually:` window and comment below is theirs byte for byte.
# Re-diff it against their tree if the PR gains commits; their version wins and this copy is
# replaced.
#
# Note what is NOT here: a `secret:`. The CANDY declares `API_KEY` as `secret_require`, and that is
# where the keyed posture belongs — `charly config` mints a value for it and the unit carries
# `Secret=<name>,type=env,target=API_KEY`. A deploy-level entry would be a second declaration of the
# same secret, and (measured) one whose name has no stored value injects NOTHING: it would read as
# "the keyed posture is under test" while testing the keyless branch. The bed therefore declares no
# secret and lets the layer's `strata-api-gate` probe assert the gate.
#
# It needs the GPU venue (`requires_shared: [nvidia-gpu]`, so the arbiter attaches the CDI device)
# and a PROVISIONED model store, so a test bed never downloads 37-188 GB. It is deliberately NOT in
# the default roster — the umbrella's `check-all-beds` excludes it — and is run on demand:
#   charly check run check-strata-gpu-pod          (from this repo)
#   charly check run strata.check-strata-gpu-pod   (from the umbrella, namespace-qualified)
#
# PRE-FLIGHT before the run (learned on the layer leg, and both are real). The deploy plugin must
# be current or the emitted unit lacks the `userns=host`/`User=0:0` shape this bed's identity
# assertion is written against:
#   charly cache refresh
#   charly deploy add check-strata-gpu-pod --disposable     (box-level `security:` is captured HERE)
#   charly config check-strata-gpu-pod
# and then READ the unit before spending 20 minutes on the store: it must carry `UserNS=host`,
# `User=0:0`, `PodmanArgs=--security-opt no-new-privileges`, `AddDevice=nvidia.com/gpu=all`, and no
# `keep-id`. A `security:` added to the box AFTER a deploy exists reaches nothing until
# `charly deploy del` + `charly deploy add`.
#
check-strata-gpu-pod:
    pod:
        image: strata
        disposable: true
        lifecycle: dev
        # A GPU-CDI POD claims the REFCOUNTED axis: requires_shared flips the IOMMU group
        # vfio->nvidia+CDI at this bed's deploy and back only when the LAST claimant releases.
        # requires_exclusive is the VM/sole-use axis and asks for the flip TO vfio -- measured
        # 2026-10-17: declaring it on this pod made the arbiter try a vfio switch, which a live
        # desktop session (Hyprland) correctly refused.
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof the REAL engine serves: the released engine component resolves usable and signed
            against the CDI-injected driver, the model loads from a provisioned store, the run settings
            the entrypoint derived are what the deployment asked for, pictures are ON by the candy's own
            default (a real PNG round-trips), and a completion round-trips through the key gate. Needs
            the GPU venue and the pre-staged GGUF shards; run on demand, never in the default roster.
        env:
            # The provisioned model on this venue, named the way upstream's entrypoint reads it. No
            # VISION here on purpose: the pictures-on assertion below must be the CANDY's default, not
            # a value this bed set (a bed that pinned it would pass with the default broken).
            FAMILY: qwen
            MODEL: IQ2_XS
            # The store's own shards, at the path upstream's FIRST-START MIGRATION creates: the
            # entrypoint moves /data/models -> /data/Strata-data/models BEFORE it validates MODEL_PATH,
            # so this path exists by the time it is checked. A folder with no `*.gguf` directly in it
            # stops the start with an explicit message rather than downloading — the honest failure,
            # quoted verbatim in the PR body if it fires.
            MODEL_PATH: /data/Strata-data/models/IQ2_XS
            # Deliberately ABOVE the engine's own recommendation for this card, so the projection
            # assertion can actually FAIL: on the venue's RTX 4080 SUPER (15.99 GB) the recommendation
            # is 32768.
            CONTEXT: "65536"
        volume:
            # The operator's model store, mounted at /data — the whole store, not a sub-folder: the
            # entrypoint's migration, the presets, the run settings, the packs, the encoder and the key
            # all live under it, and a candy can never pin a host path (`~` is expanded by charly).
            - {name: strata-data, type: bind, host: ~/.local/share/strata, path: /data}
        # No `secret:` entry here on purpose. `API_KEY` is declared `secret_require` by the CANDY, which
        # is where the keyed posture belongs: `charly config` mints a value for it and the unit carries
        # `Secret=<name>,type=env,target=API_KEY`. A deploy-level entry would be a second declaration of
        # the same secret, and (measured) one whose name has no stored value injects NOTHING — it would
        # read as "the keyed posture is under test" while testing the keyless branch.
        # VENUE PRECONDITION: this bed names a specific venue and never downloads WEIGHTS. The store must
        # already hold the model's shards (IQ2_XS: two .gguf files, ~66 GB) — a host with the card but an
        # empty store cannot run it. Stating it here because "run on demand" otherwise reads as
        # "runnable anywhere". The encoder file for pictures (~0.9 GB) is the ONE thing the first start
        # may fetch; network is available on the venue and the fetch is upstream's.
        #
        # Every assertion below is a REAL boundary, not an internal file name: the projection the server
        # publishes, the load the engine reports, one picture round-trip and one completion. The store's
        # own layout is upstream's business — the v0.1.x run config under /data/config is not read by
        # this image at all, and asserting on it would be asserting on a file that is now history.
        plan:
            - check: /health reports the context this deployment asked for, and pictures by DEFAULT
              id: strata-gpu-projection
              context: [runtime]
              timeout: 5500s
              exit_status: 0
              # The expectation is the literal this bed declares above, not a reference to a variable:
              # the check-var resolver does not see the pod env, so a braced reference is SKIPPED as
              # unresolved — an assertion silently absent. 65536 differs from the engine's own 32768
              # recommendation for this card, so it can actually fail.
              #
              # `images=true` is asserted here with NO vision variable in the bed's env, which is what
              # makes it the FAMILY default (the candy's `VISION: cpu`) rather than a value the bed
              # imposed. `eventually` is the documented poll-until-pass matcher, not a sleep: the first
              # start may migrate a ~150 GB store, re-derive the run settings and fetch the picture
              # reader, and each failed pass reports its attempt count and elapsed time instead of a
              # bare timeout. The probe is the candy's own helper, so the projection is read by one
              # implementation on every deployment (R2).
              eventually: "5400s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py health max_context=65536 images=true
            - check: the engine process is alive and the model is loaded, not merely listening
              id: strata-gpu-loaded
              context: [runtime]
              timeout: 3700s
              exit_status: 0
              # `loaded` is the server's own answer to "is the engine up" (serve/server.py), so this
              # separates "the HTTP server answers" from "the weights are in memory". With pictures on,
              # upstream cannot lazy-load the model (its settings validator refuses the pair), so the
              # load happens at container start and this step is the witness that it completed.
              eventually: "3600s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py health loaded=true
            - check: a real picture round-trips and the answer names the colour
              id: strata-gpu-vision-roundtrip
              context: [runtime]
              timeout: 1900s
              exit_status: 0
              # The only assertion here that a config inspection cannot fake: the helper builds a real
              # 64x64 red PNG in the container (zlib+struct, so no imaging library and nothing new
              # installed), posts it as a base64 data URL and requires the colour word in the answer.
              # It is also the end-to-end proof of the ENCODER: the `strata-vision` binary is in the
              # image (the candy's `strata-vision-binary` asserts that) and the encoder FILE is model
              # data fetched once into the store, so a venue without it fails here rather than silently
              # serving text.
              eventually: "1800s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py vision
            - check: the pod runs the engine build this repo pins, as the mapped runtime user
              id: strata-gpu-terminal
              context: [runtime]
              timeout: 300s
              exit_status: 0
              # The Terminal executes INSIDE the pod (the first thing anyone runs by hand), and it
              # reports the build it carries — 0.1.62 is the pinned `STRATA_ENGINE_VERSION`, so a repin
              # that did not move this line fails here. The literal is stated rather than resolved for
              # the same reason as the projection step.
              #
              # THE IDENTITY IS uid 0, AND THAT IS NOT A ROOT ESCALATION. A unit that carries a CDI GPU
              # device is emitted `userns=host` + `User=0:0` (opencharly/plugin-deploy-pod#81/#82),
              # because the kernel's idmapped-mount path needs CAP_SYS_ADMIN in the user namespace that
              # owns the filesystem's superblock and a rootless container cannot idmap HOST files. Under
              # `userns=host` a rootless container's uid 0 IS the invoking host user: measured on this
              # image, a file created in the bind lands on the host as 1000:1000 and `podman info`
              # reports `rootless=true`. So the assertion is uid 0 — asserting 1000 would be a check
              # about the SUBSTRATE's mapping rather than about this image, and it would flip the day a
              # substrate legitimately changes it (which is exactly what happened to this line).
              command: |
                  /opt/strata/terminal/python/bin/python3 - <<'PY'
                  import os, subprocess, sys
                  out = subprocess.run(["/opt/strata/terminal/bin/strata", "--version"],
                                       capture_output=True, text=True).stdout.strip()
                  print(out, "| uid", os.getuid())
                  ok = (out.startswith("strata 0.2.16") and "build 0.1.62" in out and os.getuid() == 0)
                  sys.exit(0 if ok else 1)
                  PY
