# opencharly/pod-strata — the Strata POD: the engine served from the CDI pod contract.
#
# Two things live here, and the split is the cutover's whole point (opencharly/opencharly#1174):
#
#   box/strata/charly.yml   the `strata` IMAGE — `base: pod-cdi.pod-cdi`, composing
#                           opencharly/layer-strata's engine candy. The POD, and the box skill.
#   this file               the `check-strata-gpu-pod` disposable bed — the family's ONLY
#                           witness — and the `defaults:`/`import:`/`discover:` the box needs.
#
# The engine itself (the bake, the artifact pins, the env surface) stays in
# opencharly/layer-strata; this repo composes it and proves it. The rule is `AGENTS.md`'s.
repo: github.com/opencharly/pod-strata
defaults:
    # `tag` + `registry` only, and only here: a TOP-LEVEL `registry:` is rejected by the schema.
    #
    # Without the registry the BUILD tags the image `localhost/strata:<check-tag>` while the pod
    # deploy resolves `ghcr.io/opencharly/strata:<check-tag>`, so the deploy cannot see the freshly
    # built image and tries to pull it instead. Measured on the family's bed run before the split:
    # image-build PASS, check-image PASS, deploy-add PASS, then
    # `charly config: unable to copy from source docker://ghcr.io/opencharly/strata:check-strata-gpu-pod-…`.
    # Invisible to `box validate`, to `box generate`, to the build and to every image check: only the
    # deploy compares the built identity with the deployed one.
    #
    # `platform:` and `build:` are NOT here — each is declared on the box that needs it. A default is
    # a value for every image in the repo; this repo has one image and it states its own contract,
    # exactly as the base (pod-cdi) does.
    tag: auto
    registry: ghcr.io/opencharly
import:
    # The POD contract, as a namespace, so the box can say `base: pod-cdi.pod-cdi`.
    #
    # HERE, at the PROJECT root — not in `box/strata/charly.yml` beside the `base:` that uses it.
    # That placement reads better (the box would be self-contained) and it is what an earlier draft
    # of this repo did. It does not work, and `charly box validate` does not say so. Measured
    # 2026-11-19 on this tree with the SAME import moved into the discovered box file and nothing
    # else changed:
    #   $ charly box validate
    #   charly box validate: OK — checked 12 candies, 1 box, 1 deploy, 6 distros, 7 builders;
    #   0 warnings, 0 errors                       # 12 candies / 1 box, against 136 / 13 at the root
    #   $ charly box generate
    #   charly: error: command "generate": rendering Containerfiles: generating Containerfile for
    #   strata: candy github.com/opencharly/layer-build-toolchain: resolved 12 package(s) [autoconf
    #   automake binutils bison ccache cmake flex gdb git libtool nasm patch] but box strata has no
    #   distro definition to install them with      # rc=1
    # A namespace mounted by a discovered document is visible to that document's own lookups and
    # NOT to the project's entity set, so the base's `distro:`/`build:` chain never arrives — and
    # `validate` still passes because every entity it loaded is individually consistent. The
    # generate step is the instrument that catches it; run BOTH after any manifest edit.
    #
    # A MERGED TAG, never a branch or a SHA: an `@github` ref does not resolve for anything else
    # (opencharly/charly#1201), and only a merged ref is a pin (AGENTS.md Part II #3). This is
    # `pod-cdi`'s newest release, measured 2026-11-19 —
    #   $ git -C pod-cdi for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -1
    #   v2026.323.1302
    #   $ git -C pod-cdi merge-base --is-ancestor v2026.323.1302 origin/main; echo $?
    #   0
    # — and it composes `layer-cdi:v2026.323.0302`, which requires `layer-cuda:v2026.323.0252` and
    # nothing from `layer-nvidia`. The whole chain, command by command: `PIN-CHAIN.md`.
    # The pin must also stay new enough that the imported namespace LOADS under the charly
    # binary the umbrella pins. The floor was v2026.324.1644 (pod-cdi resolving distro-arch
    # v2026.324.0908, which carries distro-arch#74 and nests `check-arch-vm`'s members inside
    # the bed's venue); this pin is v2026.326.1530, the release that ALSO resolves a
    # post-cutover distro-arch (v2026.326.1455), because opencharly/spec#420 turned `aur`
    # into a routed builder and a pre-cutover distro tree cannot load at all
    # (`#CandyValue.build.1: conflicting values "pac" and "aur"`). v2026.325.1329 — the
    # previous pin — resolves arch v2026.325.1112 and therefore fails that load; it is also
    # the release that stopped the CDI base emitting the retired
    # `COPY --from=<carrier> .agents/skills` step (opencharly/pod-cdi#10).
    # At v2026.323.1302 the umbrella fails to load at all (opencharly/pod-kde-vnc#3 and #4).
    - pod-cdi: '@github.com/opencharly/pod-cdi:v2026.326.1530'
discover:
    - path: box
      recursive: true

#  opencharly/pod-strata — the skill-prose bundle for the Strata POD.
#
#  WHY THIS CANDY EXISTS (opencharly/sdk#611, opencharly/layer-strata#28): a `skill:` node's
#  `owner:` must name a candy DEFINED IN THE SAME REPO as its body. The box composes the engine
#  candy from opencharly/layer-strata — a foreign candy — so it cannot own that candy's prose: the
#  collector resolves the body at the OWNER candy's repo root, and before this candy the node named
#  `strata`, whose body was only ever found in layer-strata's tree by a duplicate that the v0.2.16
#  cutover deleted. The pin bump to v2026.326.0119 surfaced it: `skill "strata": no body`.
#
#  This candy owns the node instead, and the body lives beside this manifest under
#  `.agents/skills/strata/SKILL.md` (the Agent-Skills standard tree) — the one place the
#  marketplace/docs generators and the `ai.opencharly.skill` label projection read.
#
#  THE CANDY CARRIES THE PROSE INTO THE IMAGE: composed into the box, it installs the tree at the
#  uid-1000 account's `~/.agents/skills` — the location a harness running inside the image reads —
#  and its ADE `check:` proves the install landed.
strata-skills:
    candy:
        description: |
            Skill-prose bundle for the Strata POD: owns the `strata` `skill:` entity (a sibling node
            in box/strata/charly.yml) and carries its body under .agents/skills/strata/SKILL.md.
            It exists because a `skill:` node's owner must be a candy defined in the SAME repo as
            its body, and the box composes the engine candy from opencharly/layer-strata
            (opencharly/sdk#611, opencharly/layer-strata#28).
            Composed by the box; installs the tree at the uid-1000 account's ~/.agents/skills so a
            harness in the image reads the same prose the label carries.
        plan:
            - run: install the skill tree at the uid-1000 account's Agent-Skills location
              id: install-skill-tree
              copy: .agents/skills
              to: "${HOME}/.agents/skills"
              run_as: "${USER}"
              comment: the body the ai.opencharly.skill label projects, made readable in-image
            - check: the skill body this candy carries is installed under the uid-1000 account's ~/.agents/skills
              id: skill-bodies-installed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  H="$(awk -F: '$3 == 1000 { print $6 }' /etc/passwd)"
                  test -n "$H"
                  test -s "$H/.agents/skills/strata/SKILL.md"

# check-strata-gpu-pod — the family's REAL-engine witness, and its ONLY bed.
#
# MOVED, not rewritten: this block is the text of the bed that lives in opencharly/layer-strata's
# root manifest at the head of its v0.2.16 PR (`opencharly/layer-strata#24`, head
# `180be5a9fbe9d6c3d5062b8a82e4551cd583098f`), which is the revision its GPU gate passed on. Ported
# 1:1 — the ONE difference the base change makes is which repo the `image: strata` name resolves in,
# so every assertion, timeout, `eventually:` window and comment below is theirs byte for byte.
# Re-diff it against their tree if the PR gains commits; their version wins and this copy is
# replaced.
#
# Note what is NOT here: a `secret:`. The CANDY declares `API_KEY` as `secret_accept` (ledger `P10`
# of opencharly/layer-strata), so the key is a POSTURE: with nothing stored nothing is injected, and
# the deployment's `STRATA_NO_API_KEY` decides whether the launcher serves keyless. This bed declares
# no secret and lets the layer's `strata-api-gate` probe assert whichever branch the host's credential
# store puts it in; `check-strata-keyless-pod` below pins the keyless branch explicitly.
#
# It needs the GPU venue (`requires_shared: [nvidia-gpu]`, so the arbiter attaches the CDI device)
# and a PROVISIONED model store, so a test bed never downloads 37-188 GB. It is deliberately NOT in
# the default roster — the umbrella's `check-all-beds` excludes it — and is run on demand:
#   charly check run check-strata-gpu-pod          (from this repo)
#   charly check run strata.check-strata-gpu-pod   (from the umbrella, namespace-qualified)
#
# PRE-FLIGHT before the run (learned on the layer leg, and both are real). The deploy plugin must
# be current or the emitted unit lacks the `userns=host`/`User=0:0` shape this bed's identity
# assertion is written against:
#   charly cache refresh
#   charly deploy add check-strata-gpu-pod --disposable     (box-level `security:` is captured HERE)
#   charly config check-strata-gpu-pod
# and then READ the unit before spending 20 minutes on the store: it must carry `UserNS=host`,
# `User=0:0`, `PodmanArgs=--security-opt no-new-privileges`, `AddDevice=nvidia.com/gpu=all`, and no
# `keep-id`. A `security:` added to the box AFTER a deploy exists reaches nothing until
# `charly deploy del` + `charly deploy add`.
#
check-strata-gpu-pod:
    pod:
        image: strata
        disposable: true
        lifecycle: dev
        # A GPU-CDI POD claims the REFCOUNTED axis: requires_shared flips the IOMMU group
        # vfio->nvidia+CDI at this bed's deploy and back only when the LAST claimant releases.
        # requires_exclusive is the VM/sole-use axis and asks for the flip TO vfio -- measured
        # 2026-10-17: declaring it on this pod made the arbiter try a vfio switch, which a live
        # desktop session (Hyprland) correctly refused.
        requires_shared: [nvidia-gpu]
        description: >-
            Sole proof the REAL engine serves: the released engine component resolves usable and signed
            against the CDI-injected driver, the model loads from a provisioned store, the run settings
            the entrypoint derived are what the deployment asked for, pictures are ON by the candy's own
            default (a real PNG round-trips), and a completion round-trips through the key gate. Needs
            the GPU venue and the pre-staged GGUF shards; run on demand, never in the default roster.
        env:
            # The provisioned model on this venue, named the way upstream's entrypoint reads it. No
            # VISION here on purpose: the pictures-on assertion below must be the CANDY's default, not
            # a value this bed set (a bed that pinned it would pass with the default broken).
            FAMILY: qwen
            MODEL: IQ2_XS
            # The store's own shards, at the path upstream's FIRST-START MIGRATION creates: the
            # entrypoint moves /data/models -> /data/Strata-data/models BEFORE it validates MODEL_PATH,
            # so this path exists by the time it is checked. A folder with no `*.gguf` directly in it
            # stops the start with an explicit message rather than downloading — the honest failure,
            # quoted verbatim in the PR body if it fires.
            MODEL_PATH: /data/Strata-data/models/IQ2_XS
            # Deliberately ABOVE the engine's own recommendation for this card, so the projection
            # assertion can actually FAIL: on the venue's RTX 4080 SUPER (15.99 GB) the recommendation
            # is 32768.
            CONTEXT: "65536"
            # The bed pins TWO engine settings for its own run, both measured, because the store it
            # binds carries the OPERATOR's run settings:
            #
            #   idle-unload=0      a deployment that releases the model after five idle minutes
            #                      (opencharly/layer-strata#26) makes this bed non-deterministic:
            #                      between the vision probe's retries the model unloads and most
            #                      attempts pay a cold load.
            #   vram-reserve-mib=512  the picture path needs room to allocate. With the operator's
            #                      reserve of 0 the card reports 13 MiB free at request time and the
            #                      prefill GEMM dies:
            #                        prefill gemm: cublasGemmEx f16: cuBLAS status 14
            #                      after which supervisord restarts the engine (~60 s cycle, 35
            #                      failed probe attempts over 30 minutes). 512 MiB is the figure the
            #                      engine's own warning asks for on this card.
            #
            # A bed asserts behaviour, so it configures the venue the behaviour needs instead of
            # racing the operator's deployment posture.
            STRATA_SET: "idle-unload=0 vram-reserve-mib=512"
        volume:
            # The operator's model store, mounted at /data — the whole store, not a sub-folder: the
            # entrypoint's migration, the presets, the run settings, the packs, the encoder and the key
            # all live under it, and a candy can never pin a host path (`~` is expanded by charly).
            - {name: strata-data, type: bind, host: ~/.local/share/strata, path: /data}
        # No `secret:` entry here on purpose. `API_KEY` is `secret_accept` in the CANDY (ledger `P10`),
        # so this bed's posture is whatever the host's credential store yields: a stored key is
        # injected and `strata-api-gate` asserts the 401/200 branch; with none stored the launcher mints
        # its own (or serves keyless when `STRATA_NO_API_KEY=1`). A deploy-level `secret:` would be a
        # second declaration of the same credential.
        # VENUE PRECONDITION: this bed names a specific venue and never downloads WEIGHTS. The store must
        # already hold the model's shards (IQ2_XS: two .gguf files, ~66 GB) — a host with the card but an
        # empty store cannot run it. Stating it here because "run on demand" otherwise reads as
        # "runnable anywhere". The encoder file for pictures (~0.9 GB) is the ONE thing the first start
        # may fetch; network is available on the venue and the fetch is upstream's.
        #
        # Every assertion below is a REAL boundary, not an internal file name: the projection the server
        # publishes, the load the engine reports, one picture round-trip and one completion. The store's
        # own layout is upstream's business — the v0.1.x run config under /data/config is not read by
        # this image at all, and asserting on it would be asserting on a file that is now history.
        plan:
            - check: /health reports the context this deployment asked for, and pictures by DEFAULT
              id: strata-gpu-projection
              context: [runtime]
              timeout: 5500s
              exit_status: 0
              # The expectation is the literal this bed declares above, not a reference to a variable:
              # the check-var resolver does not see the pod env, so a braced reference is SKIPPED as
              # unresolved — an assertion silently absent. 65536 differs from the engine's own 32768
              # recommendation for this card, so it can actually fail.
              #
              # `images=true` is asserted here with NO vision variable in the bed's env, which is what
              # makes it the FAMILY default (the candy's `VISION: cpu`) rather than a value the bed
              # imposed. `eventually` is the documented poll-until-pass matcher, not a sleep: the first
              # start may migrate a ~150 GB store, re-derive the run settings and fetch the picture
              # reader, and each failed pass reports its attempt count and elapsed time instead of a
              # bare timeout. The probe is the candy's own helper, so the projection is read by one
              # implementation on every deployment (R2).
              eventually: "5400s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py health max_context=65536 images=true
            - check: the engine process is alive and the model is loaded, not merely listening
              id: strata-gpu-loaded
              context: [runtime]
              timeout: 3700s
              exit_status: 0
              # `loaded` is the server's own answer to "is the engine up" (serve/server.py), so this
              # separates "the HTTP server answers" from "the weights are in memory". The candy now
              # DEFERS the model to the first request (lazy by default, layer-strata#33), so the
              # load this step waits for is the one the composed `strata-completion` round-trip
              # triggers; it asserts that load COMPLETES, not that it happens at container start.
              # (Before layer-strata#33 the pair pictures+lazy was refused in the launcher, so the
              # load happened at start — the ordering is now covered by `check-strata-idle-pod`.)
              eventually: "3600s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py health loaded=true
            - check: a real picture round-trips and the answer names the colour
              id: strata-gpu-vision-roundtrip
              context: [runtime]
              timeout: 1900s
              exit_status: 0
              # The only assertion here that a config inspection cannot fake: the helper builds a real
              # 64x64 red PNG in the container (zlib+struct, so no imaging library and nothing new
              # installed), posts it as a base64 data URL and requires the colour word in the answer.
              # It is also the end-to-end proof of the ENCODER: the `strata-vision` binary is in the
              # image (the candy's `strata-vision-binary` asserts that) and the encoder FILE is model
              # data fetched once into the store, so a venue without it fails here rather than silently
              # serving text.
              eventually: "1800s"
              retry_interval: "30s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py vision
            - check: the pod runs the engine build this repo pins, as the mapped runtime user
              id: strata-gpu-terminal
              context: [runtime]
              timeout: 300s
              exit_status: 0
              # The Terminal executes INSIDE the pod (the first thing anyone runs by hand), and it
              # reports the build it carries — 0.1.62 is the pinned `STRATA_ENGINE_VERSION`, so a repin
              # that did not move this line fails here. The literal is stated rather than resolved for
              # the same reason as the projection step.
              #
              # THE IDENTITY IS uid 0, AND THAT IS NOT A ROOT ESCALATION. A unit that carries a CDI GPU
              # device is emitted `userns=host` + `User=0:0` (opencharly/plugin-deploy-pod#81/#82),
              # because the kernel's idmapped-mount path needs CAP_SYS_ADMIN in the user namespace that
              # owns the filesystem's superblock and a rootless container cannot idmap HOST files. Under
              # `userns=host` a rootless container's uid 0 IS the invoking host user: measured on this
              # image, a file created in the bind lands on the host as 1000:1000 and `podman info`
              # reports `rootless=true`. So the assertion is uid 0 — asserting 1000 would be a check
              # about the SUBSTRATE's mapping rather than about this image, and it would flip the day a
              # substrate legitimately changes it (which is exactly what happened to this line).
              command: |
                  /opt/strata/terminal/python/bin/python3 - <<'PY'
                  import os, subprocess, sys
                  out = subprocess.run(["/opt/strata/terminal/bin/strata", "--version"],
                                       capture_output=True, text=True).stdout.strip()
                  print(out, "| uid", os.getuid())
                  ok = (out.startswith("strata 0.2.16") and "build 0.1.62" in out and os.getuid() == 0)
                  sys.exit(0 if ok else 1)
                  PY

# check-strata-keyless-pod — the KEYLESS posture's witness (opencharly/layer-strata#27).
#
# The same image, the same provisioned store and the same GPU venue as `check-strata-gpu-pod`; the
# ONE difference is the posture the change under test adds. The key is not a secret this image
# requires any more (the candy declares `secret_accept`), and `STRATA_NO_API_KEY: "1"` makes the
# launcher serve without one — upstream's own warned posture beside `--access lan`.
#
# It declares ONE step of its own — the posture itself, which no inherited probe can prove — and
# inherits the rest: the CANDY carries the runtime probes (`strata-health`, `strata-engine-usable`,
# `strata-projection`, `strata-api-gate`, `strata-completion`). `strata-api-gate` BRANCHES on the key
# actually in force and passes on either posture, so it cannot witness the keyless one; the
# `strata-keyless-gate` step below asserts `/health` reports `api_key: false`, which FAILS on a
# keyed deployment (without the candy's patch the launcher mints a key at `--access lan`).
#
# Run it with NO key in the host credential store (`charly secrets delete charly/secret API_KEY`):
# a stored key is injected by `charly config` and would silently turn this into the keyed branch.
#
check-strata-idle-pod:
    pod:
        image: strata
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        description: >-
            The CANDY's DEFAULT posture, proven on a disposable GPU pod: with NO `STRATA_SET` and NO
            `VISION` in the env, the server must start with the MODEL DEFERRED to the first request
            (lazy by the candy's default, pictures ON), answer with pictures and the context this
            deployment asks for, RELEASE the model after five idle minutes (`idle-unload=300`), and
            reload it on the next request. Exists because `check-strata-gpu-pod` pins its own
            `STRATA_SET` for determinism, so it can never prove the default (opencharly/layer-strata#32). Needs the
            GPU venue and the pre-staged store; run on demand, never in the default roster.
        env:
            FAMILY: qwen
            MODEL: IQ2_XS
            MODEL_PATH: /data/Strata-data/models/IQ2_XS
            CONTEXT: "65536"
            # NO STRATA_SET: the candy's defaults are the SUBJECT of this bed (idle-unload, reserve).
            # NO VISION: pictures must be ON by the candy's default, not by this bed.
            # CONTEXT is a MODEL parameter this bed names (the store's preset carries the same
            # value), so the projection assertion proves the request is honoured — NOT that the
            # candy defaults the context; the default-proof claim is scoped to pictures and the
            # two STRATA_SET values.
        volume:
            - {name: strata-data, type: bind, host: ~/.local/share/strata, path: /data}
        plan:
            - check: the container started with the model DEFERRED — lazy by the CANDY's default — with pictures ON
              id: strata-default-lazy-start
              context: [runtime]
              timeout: 600s
              exit_status: 0
              # WHY the server's OWN startup log and not `/health`'s `loaded`: the composed strata
              # candy's plan runs a completion round-trip BEFORE this bed's steps, so the model is
              # loaded in BOTH postures by now. WHY not an engine-process start-time delta either:
              # the engine PROCESS starts at container start in both postures — lazy defers the
              # MODEL, not the process (measured: the /proc delta is ~0 s with P11 applied too).
              #
              # The startup decision is written once, at start, and the log is append-only, so the
              # LAST startup block IS this container's. Each posture has its own block opener — the
              # eager `loading the vision encoder ...` / `loading the model (the first start takes a
              # minute...` pair, or the lazy `vision encoder unloaded; it starts with the model` —
              # and the lazy MODEL line is deliberately NOT an opener, because it sits INSIDE the
              # lazy block. Slicing at the last opener therefore binds the assertion to this
              # container: a run WITHOUT the lazy guard lands on an eager block and fails here
              # instead of passing on an older lazy one (verified offline: the real log passes, the
              # same log with an eager block appended last fails).
              # The `stdout` matcher is the ONE line this command prints — the health JSON is
              # `grep -q`'d in-command (a silent gate), so a matcher for its text can never be
              # satisfied by the output (measured: the step failed on exactly that, with the
              # behaviour itself green).
              stdout:
                - contains: "LAZY-START"
              command:
                command: |
                  set -eu
                  log=/data/state/strata/runtime/launch-docker.server.log
                  [ -f "$log" ] || { echo "no server log at $log"; exit 1; }
                  block=/tmp/strata-startup-block.txt
                  awk '/^loading the vision encoder \.\.\.$/ || /^vision encoder unloaded; it starts with the model/ || /^loading the model \(the first start takes a minute/ { buf = "" } { buf = buf $0 "\n" } END { printf "%s", buf }' "$log" > "$block"
                  [ -s "$block" ] || { echo "no startup block found in $log"; exit 1; }
                  grep -q '^vision encoder unloaded; it starts with the model' "$block" || { echo "the vision encoder was LOADED at start — the pair was not lazy"; exit 1; }
                  grep -q '^model unloaded; the first request loads it' "$block" || { echo "the model was not deferred to the first request"; exit 1; }
                  grep -q 'the model unloads after 300.0 s without requests' "$block" || { echo "the candy's five-minute idle window is not in force at start"; exit 1; }
                  grep -q 'images on' "$block" || { echo "the server did not start with pictures ON"; exit 1; }
                  if grep -q 'loading the model (the first start takes a minute' "$block"; then
                    echo "the model was loaded AT START — lazy was not applied"; exit 1
                  fi
                  curl -sf http://localhost:8080/health | grep -q '"images": true'
                  echo "LAZY-START (the model waited for the first request, pictures ON)"
                in_container: true
            - check: the FIRST request loads the model and is answered
              id: strata-default-first-load
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                - contains: "LOADED-ON-DEMAND"
              command:
                command: |
                  set -eu
                  code=$(curl -s -o /dev/null -w '%{http_code}' -m 600 -X POST http://localhost:8080/v1/chat/completions \
                    -H 'Content-Type: application/json' \
                    -d '{"model":"qwen3.8-flash-next","messages":[{"role":"user","content":"one word: ok"}],"max_tokens":4}')
                  [ "$code" = "200" ] || { echo "completion answered $code"; exit 1; }
                  curl -sf http://localhost:8080/health | grep -q '"loaded": true' && echo "LOADED-ON-DEMAND"
                in_container: true
            - check: the model is RELEASED after five idle minutes with no request
              id: strata-default-idle-unload
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                - contains: "RELEASED"
              command:
                command: |
                  set -eu
                  # A check step resolves only the runner's auto-exported variables, so the shell's
                  # own SECONDS is DEAD here (measured: "assertion is DEAD ... SECONDS"). A bounded
                  # counter says the same thing without a name the resolver owns.
                  i=0
                  while [ $i -lt 48 ]; do
                    h=$(curl -sf http://localhost:8080/health || true)
                    case "$h" in
                      *'"loaded": false'*) echo "RELEASED within the idle window"; exit 0 ;;
                    esac
                    i=$((i + 1))
                    sleep 10
                  done
                  echo "NOT released within 480s: $h"
                  exit 1
                in_container: true
            - check: the next request reloads the model and is answered
              id: strata-default-reload
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                - contains: "RELOADED"
              command:
                command: |
                  set -eu
                  code=$(curl -s -o /dev/null -w '%{http_code}' -m 300 -X POST http://localhost:8080/v1/chat/completions \
                    -H 'Content-Type: application/json' \
                    -d '{"model":"qwen3.8-flash-next","messages":[{"role":"user","content":"one word: ok"}],"max_tokens":4}')
                  [ "$code" = "200" ] || { echo "completion answered $code"; exit 1; }
                  curl -sf http://localhost:8080/health | grep -q '"loaded": true' && echo "RELOADED after a 200 completion"
                in_container: true
check-strata-keyless-pod:
    pod:
        image: strata
        disposable: true
        lifecycle: dev
        requires_shared: [nvidia-gpu]
        description: >-
            The keyless posture: the launcher serves beside `--access lan` without an API key, `/health`
            reports `api_key: false`, and `/v1/models` answers 200 anonymously while a completion still
            round-trips. Needs the GPU venue and the provisioned store; run on demand, never in the
            default roster.
        env:
            FAMILY: qwen
            MODEL: IQ2_XS
            MODEL_PATH: /data/Strata-data/models/IQ2_XS
            CONTEXT: "65536"
            # The same two engine settings the keyed bed pins, for the same measured reasons
            # (idle-unload=0 keeps the model resident between probe retries; vram-reserve-mib=512 is
            # what the engine's own warning asks for on this card).
            STRATA_SET: "idle-unload=0 vram-reserve-mib=512"
            # THE ARM: no key, upstream's launcher switch, through the candy's own name (ledger P10).
            STRATA_NO_API_KEY: "1"
        volume:
            # The operator's store, exactly as the keyed bed binds it — the preset, the run settings
            # and the prepared pack are what the probes read.
            - {name: strata-data, type: bind, host: ~/.local/share/strata, path: /data}
        plan:
            # The posture, and ONLY the posture: `/health` publishes `api_key` as the server's own
            # answer, so `false` is what a keyless deployment says and what a keyed one cannot.
            # `strata-api-gate` (inherited from the candy) passes on either posture, which is why it
            # is not enough here. The probe is the candy's helper (one implementation, R2).
            - check: the deployment serves keyless — /health publishes api_key=false
              id: strata-keyless-gate
              context: [runtime]
              timeout: 1900s
              exit_status: 0
              # A fresh store may still be loading; `eventually` is the poll-until-pass matcher.
              eventually: "1800s"
              retry_interval: "15s"
              command: /opt/strata/terminal/python/bin/python3 /opt/strata/charly-probes.py health api_key=false
